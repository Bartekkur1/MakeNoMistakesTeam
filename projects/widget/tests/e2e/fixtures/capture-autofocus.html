<!doctype html><html lang="pl"><meta charset="utf-8"><title>Czat z przechwytywaniem (fikcyjny)</title>
<p id="msg">Darmowe Nitro: https://nitro-gift.example/x</p><textarea id="composer" aria-label="Napisz wiadomość"></textarea>
<script>
document.addEventListener('keydown', () => {
 const active = document.activeElement;
 if (!['INPUT', 'TEXTAREA'].includes(active.tagName) && !active.isContentEditable) document.querySelector('#composer').focus();
}, { capture: true });
</script></html>
